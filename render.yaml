# Render blueprint for the Conduit multiplayer server (Evan's instance).
# Deploy from the repo root on Render ("New +" → "Blueprint") or wire it
# to the server/ directory as a web service. Secrets are sync:false —
# set JSONBIN_KEY + JSONBIN_BIN_ID in the Render dashboard, never here.
services:
  - type: web
    name: webconduit-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JSONBIN_KEY
        sync: false
      - key: JSONBIN_BIN_ID
        sync: false
